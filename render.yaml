services:
  - type: web
    name: sfx-studio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: HF_TOKEN
        sync: false
      # Free plan: sounds are kept in a Vercel Blob store (token from Vercel > Storage > Blob).
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
    # Paid plan alternative: drop BLOB_READ_WRITE_TOKEN, set SOUNDS_DIR=/var/data/sounds, and add:
    # disk:
    #   name: sounds
    #   mountPath: /var/data
    #   sizeGB: 1
